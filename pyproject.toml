[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nanoharness"
version = "0.1.0"
description = "Lightweight multi-agent orchestration engine — hand-written ReAct runtime, LLM router, multi-channel gateway"
requires-python = ">=3.12"

dependencies = [
    # LLM providers
    "anthropic>=0.40.0",
    "openai>=1.50.0",

    # Async
    "anyio>=4.0.0",

    # Channels
    "aiogram>=3.13.0",
    "discord.py>=2.4.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "websockets>=13.0",

    # Memory / storage
    "sqlite-vec>=0.1.0",
    "rank-bm25>=0.2.2",

    # Observability
    "opentelemetry-api>=1.27.0",
    "opentelemetry-sdk>=1.27.0",

    # Config
    "python-dotenv>=1.0.0",

    # Utilities
    "pydantic>=2.9.0",
    "httpx>=0.27.0",
    "structlog>=24.0.0",
]

[project.optional-dependencies]
mcp = [
    "mcp>=1.0.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-mock>=3.14.0",
    "gradio>=5.0.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
]

[project.scripts]
nanoharness = "nanoharness.cli:main"
nano = "nanoharness.nano.cli:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.hatch.build.targets.wheel]
packages = ["nanoharness"]

[tool.mypy]
python_version = "3.12"
strict = false
ignore_missing_imports = true
